<!-- templates/entry.html -->
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background:#0a0a0a;">
<script>
    if (!window.Telegram?.WebApp?.initData) {
        throw new Error("Not opened from Telegram");
    }

    const user = window.Telegram.WebApp.initDataUnsafe.user;
    const startParam = window.Telegram.WebApp.initDataUnsafe.start_param;

    fetch('/api/initial-data/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telegram_id: user.id, name: user.first_name, username: user.username, start_param: startParam })
    })
    .then(r => {
        if (r.ok) {
            window.location.href = '/games/';   
        } else {
            document.body.textContent = 'Launch error, please try logging in again';
        }
    })
    .catch(() => {
        document.body.textContent = 'Network error, please try logging in again';
    });
</script>
</body>
</html>
