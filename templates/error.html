{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlazeGift.up</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; }
        canvas { display: block; }

        #gift {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateY(-50px);
            width: 200px;
            height: 200px;
            z-index: 10;
            pointer-events: none;
        }

        .element {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateY(100px); 
            text-align: center;
            width: 100%; 
            max-width: 600px;
            padding: 0 20px;
            z-index: 10;
        }  
    </style>
</head>
<body>
<canvas id="c"></canvas>

<div id="gift"></div>
<div class="element">
    <h1 style="color: #cb8a19;">{{ message }}</h1>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script>

    lottie.loadAnimation({
        container: document.getElementById('gift'),
        renderer: 'svg',   
        loop: true,
        autoplay: true, 
        path: "{% static 'json/MoltenCore.json' %}"
    });
</script>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const drops = Array.from({ length: 55 }, () => ({
    x:     Math.random() * window.innerWidth,
    y:     Math.random() * window.innerHeight,
    len:   Math.random() * 22 + 8,
    speed: Math.random() * 0.9 + 0.3,
    alpha: Math.random() * 0.45 + 0.08,
    width: Math.random() * 1.1 + 0.3,
}));

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drops.forEach(d => {
        const grad = ctx.createLinearGradient(d.x, d.y, d.x, d.y + d.len);
        grad.addColorStop(0, 'rgba(255,160,0,0)');
        grad.addColorStop(1, `rgba(255,160,0,${d.alpha})`);
        ctx.strokeStyle = grad;
        ctx.lineWidth   = d.width;
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x, d.y + d.len);
        ctx.stroke();

        d.y += d.speed;
        if (d.y > canvas.height + 30) {
            d.y = -30;
            d.x = Math.random() * canvas.width;
        }
    });
    requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
